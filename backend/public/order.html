<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Đặt món QR</title>
  <style>
    :root {
      --bg: #f4f6f8;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --brand: #0f766e;
      --brand-dark: #115e59;
      --line: #e2e8f0;
      --danger: #b91c1c;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      color: var(--text);
      background: radial-gradient(circle at top right, #d1fae5 0%, var(--bg) 45%);
    }

    .container { max-width: 1150px; margin: 0 auto; padding: 16px; }
    .top { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; }
    .title { margin: 0; font-size: 24px; }
    .muted { color: var(--muted); font-size: 14px; }
    .ok { color: #15803d; }
    .err { color: var(--danger); }

    .tabs { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
    .tab-btn {
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 999px;
      padding: 8px 14px;
      font-weight: 600;
      cursor: pointer;
    }
    .tab-btn.active { background: var(--brand); border-color: var(--brand); color: #fff; }

    .panel { display: none; margin-top: 12px; }
    .panel.active { display: block; }

    .menu-wrap, .cart-wrap, .orders-wrap {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 14px;
    }

    .menu-grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); }
    .item-card { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: #fff; display: flex; flex-direction: column; }
    .item-image { width: 100%; height: 140px; object-fit: cover; background: #e2e8f0; }
    .item-body { padding: 10px; display: grid; gap: 8px; }
    .item-name { font-weight: 700; line-height: 1.25; min-height: 40px; }
    .item-price { color: var(--brand-dark); font-weight: 700; }

    .actions { display: flex; gap: 8px; align-items: center; }
    .btn { border: 1px solid var(--line); background: #fff; border-radius: 10px; padding: 8px 12px; cursor: pointer; font-weight: 600; }
    .btn:hover { background: #f8fafc; }
    .btn-primary { background: var(--brand); border-color: var(--brand); color: #fff; }
    .btn-primary:hover { background: #0d6660; }
    .qty { min-width: 34px; text-align: center; font-weight: 700; }

    .cart-list { display: grid; gap: 10px; margin-top: 10px; }
    .cart-item { border: 1px solid var(--line); border-radius: 10px; padding: 10px; display: grid; gap: 8px; }
    .cart-total { margin-top: 12px; padding-top: 10px; border-top: 1px dashed var(--line); display: flex; justify-content: space-between; font-weight: 700; }

    .order-card { border: 1px solid var(--line); border-radius: 10px; padding: 10px; margin-top: 10px; }
    .pill { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 12px; background: #e0f2fe; color: #0c4a6e; margin-left: 6px; }

    .toast {
      position: fixed;
      left: 50%;
      top: 16px;
      transform: translateX(-50%) translateY(-12px);
      background: #0f172a;
      color: #fff;
      padding: 10px 14px;
      border-radius: 10px;
      opacity: 0;
      transition: 0.25s ease;
      pointer-events: none;
      z-index: 999;
      font-size: 14px;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    @media (min-width: 980px) {
      .tabs { justify-content: flex-start; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="top">
      <h1 class="title">Đặt món tại bàn</h1>
      <div id="tableInfo" class="muted"></div>
      <div id="sessionInfo" class="muted"></div>
      <div id="status" class="muted"></div>

      <div class="tabs">
        <button class="tab-btn active" data-tab="menu">Thực đơn</button>
        <button class="tab-btn" data-tab="cart">Giỏ hàng (<span id="cartCount">0</span>)</button>
        <button class="tab-btn" data-tab="orders">Lịch sử đơn</button>
      </div>
    </div>

    <section id="panel-menu" class="panel active menu-wrap">
      <h3>Thực đơn</h3>
      <div id="menu"></div>
    </section>

    <section id="panel-cart" class="panel cart-wrap">
      <h3>Giỏ hàng</h3>
      <div class="muted">Them mon vào giỏ, sau do bam Đặt món.</div>
      <div id="cartList" class="cart-list"></div>
      <div class="cart-total">
        <span>Tổng tạm tính</span>
        <span id="cartTotal">0 VND</span>
      </div>
      <div class="actions" style="margin-top:10px;">
        <button id="clearCart" class="btn">Xóa giỏ</button>
        <button id="placeBtn" class="btn btn-primary">Đặt món</button>
      </div>
    </section>

    <section id="panel-orders" class="panel orders-wrap">
      <h3>Lịch sử đơn Cua Ban</h3>
      <div id="orders"></div>
    </section>
  </div>

  <div id="toast" class="toast"></div>

<script>
  const q = new URLSearchParams(window.location.search);
  const tableCode = q.get('tableCode');
  const signature = q.get('signature');

  const tableInfo = document.getElementById('tableInfo');
  const statusEl = document.getElementById('status');
  const sessionInfoEl = document.getElementById('sessionInfo');
  const menuEl = document.getElementById('menu');
  const cartListEl = document.getElementById('cartList');
  const cartTotalEl = document.getElementById('cartTotal');
  const cartCountEl = document.getElementById('cartCount');
  const ordersEl = document.getElementById('orders');
  const toastEl = document.getElementById('toast');

  const cart = new Map();
  const catalog = new Map();
  let toastTimer;

  function money(v) { return Number(v).toLocaleString() + ' VND'; }
  function setStatus(msg, ok=true) { statusEl.className = ok ? 'ok' : 'err'; statusEl.textContent = msg; }

  function showToast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove('show'), 1400);
  }

  function switchTab(tab) {
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.toggle('active', btn.dataset.tab === tab));
    document.getElementById('panel-menu').classList.toggle('active', tab === 'menu');
    document.getElementById('panel-cart').classList.toggle('active', tab === 'cart');
    document.getElementById('panel-orders').classList.toggle('active', tab === 'orders');
  }

  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => switchTab(btn.dataset.tab));
  });

  function fallbackImage(name) {
    return `https://picsum.photos/seed/${encodeURIComponent(name || 'food')}/420/280`;
  }

  function updateCartBadge() {
    let count = 0;
    for (const q of cart.values()) count += q;
    cartCountEl.textContent = count;
  }

  function addToCart(item) {
    const curr = cart.get(item.id) || 0;
    cart.set(item.id, curr + 1);
    renderCart();
    showToast(`Đã thêm ${item.name} vào giỏ`);
  }

  function decCart(itemId) {
    const curr = cart.get(itemId) || 0;
    if (curr <= 1) cart.delete(itemId); else cart.set(itemId, curr - 1);
    renderCart();
  }

  function incCart(itemId) {
    cart.set(itemId, (cart.get(itemId) || 0) + 1);
    renderCart();
  }

  function clearCart() { cart.clear(); renderCart(); }

  function renderMenu(categories) {
    menuEl.innerHTML = '';
    for (const c of categories) {
      const section = document.createElement('div');
      section.style.marginBottom = '16px';
      section.innerHTML = `<h4 style="margin:8px 0;">${c.name}</h4>`;

      const grid = document.createElement('div');
      grid.className = 'menu-grid';

      for (const item of (c.items || [])) {
        catalog.set(item.id, item);
        const card = document.createElement('div');
        card.className = 'item-card';

        const img = item.imageUrl || item.image_url || fallbackImage(item.name);
        card.innerHTML = `
          <img class="item-image" src="${img}" alt="${item.name}" loading="lazy" />
          <div class="item-body">
            <div class="item-name">${item.name}</div>
            <div class="item-price">${money(item.price)}</div>
            <button class="btn btn-primary" data-id="${item.id}">+ Them vào giỏ</button>
          </div>
        `;

        card.querySelector('button').addEventListener('click', () => addToCart(item));
        grid.appendChild(card);
      }

      section.appendChild(grid);
      menuEl.appendChild(section);
    }
  }

  function renderCart() {
    cartListEl.innerHTML = '';
    let total = 0;

    if (!cart.size) {
      cartListEl.innerHTML = '<div class="muted">Chua co mon nao trong gio.</div>';
      cartTotalEl.textContent = '0 VND';
      updateCartBadge();
      return;
    }

    for (const [id, qty] of cart.entries()) {
      const item = catalog.get(id);
      if (!item) continue;
      const sub = Number(item.price) * qty;
      total += sub;

      const row = document.createElement('div');
      row.className = 'cart-item';
      row.innerHTML = `<div><strong>${item.name}</strong></div><div class="muted">${money(item.price)} x ${qty} = <strong>${money(sub)}</strong></div>`;

      const actions = document.createElement('div');
      actions.className = 'actions';

      const dec = document.createElement('button'); dec.className = 'btn'; dec.textContent = '-'; dec.addEventListener('click', () => decCart(id));
      const qtyEl = document.createElement('div'); qtyEl.className = 'qty'; qtyEl.textContent = qty;
      const inc = document.createElement('button'); inc.className = 'btn'; inc.textContent = '+'; inc.addEventListener('click', () => incCart(id));

      actions.appendChild(dec); actions.appendChild(qtyEl); actions.appendChild(inc);
      row.appendChild(actions);
      cartListEl.appendChild(row);
    }

    cartTotalEl.textContent = money(total);
    updateCartBadge();
  }

  function renderTableOrders(orders) {
    ordersEl.innerHTML = '';
    if (!orders.length) {
      ordersEl.innerHTML = '<div class="muted">Chua co don nao trong ban nay.</div>';
      return;
    }

    for (const o of orders) {
      const card = document.createElement('div');
      card.className = 'order-card';

      const itemsHtml = (o.items || []).map(i => `<li>${i.quantity} x ${i.itemNameSnapshot} <span class="pill">${i.kitchenStatus}</span></li>`).join('');
      card.innerHTML = `<div><strong>${o.orderCode}</strong> <span class="pill">${o.status}</span></div><div class="muted">Payment: ${o.paymentStatus}</div><ul>${itemsHtml}</ul>`;
      ordersEl.appendChild(card);
    }
  }

  async function loadMenu() {
    const res = await fetch(`/api/public/menu?tableCode=${encodeURIComponent(tableCode)}&signature=${encodeURIComponent(signature)}`);
    const data = await res.json();
    if (!res.ok) throw new Error(data.message || 'Khong tai duoc menu');
    renderMenu(data.categories || []);
  }

  async function loadTableOrders() {
    const res = await fetch(`/api/public/table-orders?tableCode=${encodeURIComponent(tableCode)}&signature=${encodeURIComponent(signature)}`);
    const data = await res.json();
    if (!res.ok) throw new Error(data.message || 'Khong tai duoc lich su don');
    if (data.session) {
      sessionInfoEl.innerHTML = `Phiên hiện tại: <strong>#${data.session.id}</strong> <span class="pill">OPEN</span>`;
    } else {
      sessionInfoEl.innerHTML = 'Chưa có phiên mở. Đơn tiếp theo sẽ tạo phiên mới.';
    }
    renderTableOrders(data.orders || []);
  }

  async function placeOrder() {
    const items = [...cart.entries()].map(([menuItemId, quantity]) => ({ menuItemId, quantity }));
    if (!items.length) {
      setStatus('Vui long them mon vào giỏ truoc khi dat.', false);
      switchTab('cart');
      return;
    }

    try {
      setStatus('Đang gửi đơn...');
      const res = await fetch('/api/public/orders', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ tableCode, signature, items })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.message || 'Đặt món thất bại');

      clearCart();
      await loadTableOrders();
      setStatus(`Đặt món thành công: ${data.orderCode || 'OK'}`, true);
      showToast('Đặt món thành công');
      switchTab('orders');
    } catch (e) {
      setStatus(e.message, false);
    }
  }

  document.getElementById('placeBtn').addEventListener('click', placeOrder);
  document.getElementById('clearCart').addEventListener('click', clearCart);

  async function init() {
    tableInfo.textContent = `Bàn: ${tableCode || '-'} | Bạn có thể gọi thêm nhiều lần.`;
    if (!tableCode || !signature) { setStatus('Thieu tableCode/signature trong URL', false); return; }

    try {
      setStatus('Đang tải dữ liệu...');
      await loadMenu();
      renderCart();
      await loadTableOrders();
      setStatus('Sẵn sàng đặt món', true);
    } catch (e) {
      setStatus(e.message, false);
    }
  }

  setInterval(loadTableOrders, 3000);
  init();
</script>
</body>
</html>
